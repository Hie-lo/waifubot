# Identity trait pools (user request 2026-10-16: random characters must differ,
# and the save-character flow must build a PRECISE identity prompt that keeps
# face and details stable across generations).
#
# Data, not logic (same rule as tags_pool.yaml). Values are ENGLISH prompt
# fragments (the generator's prompt language); fa/en are button labels only.
# Every assembled identity is adult-only (minor protection, SPEC §2.3): the
# assembler always prefixes `prefix` and an adult age.
version: "1"
template_version: "identity-v1"
# No forced adult/gender framing (user 2026-10-16: the site has no such limit).
prefix: ""
# Anchors appended to the face traits of a *precise* (savec) identity — they
# tell the model to keep facial details consistent. Never added to a user's
# free-hand identity (exact identity preservation).
face_anchors: "detailed face, consistent facial features"

ages:
