# Sprint 0 spike config (THROWAWAY). Copy to spike_config.yaml and adjust.
# Hard caps are enforced in code: count<=10, timeout<=300s.

page_url: "https://perchance.org/ai-text-to-image-generator"
headless: false          # visible first; headless only if permitted & tested
count: 4                # images per run
timeout_s: 240
poll_interval_s: 3.0
spacing_s: 30           # between runs (respect permitted rate)
min_width: 256
min_height: 256
max_bytes: 10485760     # 10 MB
output_dir: "storage/spike_out"

# Selectors (baseline from PoC; VERIFY against real page)
prompt_textarea: "textarea[data-name='description']"
style_select: "select[data-name='artStyle']"
generate_button: "button#generateButtonEl"
output_iframe: "#outputIframeEl"

# Optional
style_value: "ref:optionKeyName:Soft Anime"
prompt: "masterpiece, anime girl, blue hair, smiling, high quality"
user_data_dir: "./user_data"   # persistent browser profile; "" = fresh profile each run

# Human-paced typing (user-approved 2026-10-16). Hard caps in code: max 500 ms/char.
type_delay_ms_min: 40
type_delay_ms_max: 120

# Browser automation profile — user decision 2026-10-16: match the user's working
# PoC (plain automation is blocked at the generate step; this profile works).
# CAPTCHA solving / challenge bypass / proxy rotation remain prohibited.
slow_mo_ms: 100
launch_args:
  - "--disable-blink-features=AutomationControlled"
include_canvas_fallback: true   # PoC extraction fallback (canvas->jpeg); spike-only