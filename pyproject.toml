[project]
name = "waifubot"
version = "0.1.0"
description = "Single-admin Telegram bot that generates SFW anime character images via a replaceable provider."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "aiosqlite>=0.20",
    "alembic>=1.13,<2",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "python-telegram-bot==21.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
provider = ["playwright>=1.45"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"tools/spike/*" = ["E501"]  # throwaway spike scripts
