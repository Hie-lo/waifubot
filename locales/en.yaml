help: |
  Commands:
  /generate — generate images (step-by-step wizard)
  /inbox — review new images (approve / reject / save character)
  /queue — generation queue
  /pool — approved, unpublished images
  /publish — publish to the channel now
  /characters — list characters
  /settings — settings
  /status — system status
  /pause — pause generation
  /resume — resume generation
