app_name: "WaifuBot"
welcome: "به WaifuBot خوش آمدید! من دستیار مدیریت تصاویر شما هستم."
help: |
  دستورها:
  /generate — ساخت تصویر (ویزارد گام‌به‌گام)
  /inbox — بررسی تصاویر تازه (تأیید / رد / ذخیره شخصیت)
  /queue — صف تولید
  /pool — تصاویر تأییدشدهٔ منتشرنشده
  /publish — انتشار فوری به کانال
  /characters — فهرست شخصیت‌ها
